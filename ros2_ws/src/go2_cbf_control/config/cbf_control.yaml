cbf_control:
  ros__parameters:
    # Used immediately whenever the CBF detects a stale or invalid input.
    # Tune these values from a braking test for the deployed gait and speed.
    policy_topic: /policy_vel
    goal_region_topic: /navigation/in_goal_region
    velocity_topic: /estimated_velocity
    scan_topic: /cbf/scan
    cmd_topic: /cmd_vel
    control_hz: 50.0
    solver_time_limit_s: 0.005
    publish_deadline_s: 0.010
    policy_timeout_s: 0.25
    velocity_timeout_s: 0.10
    # A scan combines two 65-ms rolling clouds.  Check its complete age from
    # the oldest point, but do not alter the Isaac-Lab CBF clearance from it.
    scan_timeout_s: 0.40
    d_margin_m: 0.70
    d_cbf_active_m: 5.0
    gamma1: 2.0
    gamma2: 2.0
    kp_x: 5.0
    kp_y: 5.0
    # Absolute linear Kp used for both X and Y while navigation reports that
    # the robot is within its configured goal region; it is not a multiplier.
    goal_region_kp: 2.0
    accel_limit_x: 5.0
    accel_limit_y: 5.0
    velocity_limit_x: 1.5
    velocity_limit_y: 1.5
    tracking_tau_s: 0.30
    max_lidar_points: 64
    slack_penalty: 1000.0
    # Hard upper bound for every active per-point CBF slack.  This is in the
    # CBF barrier residual's native units, not metres.  It is enforced in the
    # QP and independently checked before any command is published.
    max_cbf_slack: 0.5
    fallback_linear_decel_mps2: 0.5
    fallback_yaw_decel_radps2: 1.0
    recovery_valid_cycles: 3
