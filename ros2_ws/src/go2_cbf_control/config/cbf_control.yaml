cbf_control:
  ros__parameters:
    # I/O topics.
    policy_topic: /policy_vel
    goal_region_topic: /navigation/in_goal_region
    velocity_topic: /estimated_velocity
    scan_topic: /cbf/scan
    cmd_topic: /cmd_vel

    # Control rate, solver deadline, and maximum accepted input ages.
    # A scan combines two 65-ms rolling clouds; scan_timeout_s measures from
    # the oldest point in the completed scan.
    control_hz: 50.0
    solver_time_limit_s: 0.005
    publish_deadline_s: 0.010
    policy_timeout_s: 0.25
    velocity_timeout_s: 0.10
    scan_timeout_s: 0.50

    # Obstacle geometry. d_margin_m is the center-to-obstacle clearance to
    # tune first; d_cbf_active_m is the range at which obstacles enter the CBF.
    # The fixed-size solver requires max_lidar_points to remain 64.
    d_margin_m: 0.7
    d_cbf_active_m: 8.0
    max_lidar_points: 64

    # CBF dynamics and QP slack. max_cbf_slack is a barrier residual bound,
    # not a distance in metres.
    gamma1: 2.0
    gamma2: 2.0
    tracking_tau_s: 0.30
    slack_penalty: 1000.0
    max_cbf_slack: 0.5

    # Nominal planar tracking and command/acceleration limits.
    kp_x: 3.0
    kp_y: 3.0
    goal_region_kp: 1.0  # absolute X/Y Kp in the goal region, not a multiplier
    accel_limit_x: 1.5
    accel_limit_y: 1.5
    velocity_limit_x: 1.2
    velocity_limit_y: 1.2

    # Optional deployment-only slew of the planar navigation reference.
    # This acts before the QP and does not limit the final /cmd_vel slew.
    enable_navigation_slew: false
    a_nav: 2.0  # m/s^2

    # Yaw is independent of the planar CBF. Dead zones apply at CBF output.
    max_yaw_rate_radps: 2.0
    max_yaw_accel_radps2: 3.0
    planar_deadzone_mps: 0.1
    yaw_deadzone_radps: 0.1

    # On invalid input or rejected solves, briefly hold the last accepted
    # command, then slew toward a controlled stop.
    bad_solve_grace_s: 0.25
    fallback_linear_decel_mps2: 0.5
    fallback_yaw_decel_radps2: 1.0
