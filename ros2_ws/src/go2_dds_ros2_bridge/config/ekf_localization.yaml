ekf_filter_node:
  ros__parameters:
    frequency: 100.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: true
    print_diagnostics: true
    predict_to_current_time: true
    smooth_lagged_data: true
    history_length: 1.0
    transform_time_offset: 0.0
    transform_timeout: 0.0

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    odom0: /odom
    # robot_localization config vector order:
    # [x, y, z,
    #  roll, pitch, yaw,
    #  vx, vy, vz,
    #  vroll, vpitch, vyaw,
    #  ax, ay, az]
    # odom0 uses estimator twist only: vx, vy, vyaw.
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 20
    odom0_nodelay: true
    odom0_differential: false
    odom0_relative: false

    odom1: /kiss/odom
    # odom1 uses KISS pose only: x, y, yaw.
    odom1_config: [true,  true,  false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_queue_size: 10
    odom1_nodelay: true
    odom1_differential: false
    odom1_relative: true
    odom1_pose_rejection_threshold: 5.0
    odom1_twist_rejection_threshold: 1.0