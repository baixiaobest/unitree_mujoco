temporal_lidar:
  ros__parameters:
    input_topic: /cloud_registered
    output_topic: /temporal_lidar/observation
    map_frame: camera_init_correct
    base_frame: base_link
    raw_cloud_period_s: 0.065
    intercloud_tolerance_s: 0.025
    # A completed scan is emitted by every two consecutive registered clouds;
    # no fixed 130-ms scan timer is used.
    policy_hz: 15.0
    # Cloud callbacks only enqueue data. A short timer retries timestamped TF
    # lookups without blocking TF reception in the single-threaded executor.
    processing_hz: 100.0
    tf_wait_s: 0.25
    max_pending_clouds: 16
    min_z_m: -0.25
    max_z_m: 1.4
    max_range_m: 20.0
    scan_age_max_s: 0.25
    # Match the checkpoint's completed two-cloud scan: 128 observed directions
    # across the robot-front 180-degree fan. Empty covered directions are
    # known free space (distance=1, validity=1); outside the fan is unknown.
    coverage_fov_deg: 180.0
    coverage_rays_per_completed_scan: 128
    # RViz-only clouds reconstructed from the exact polar bins sent to policy.
    # frame_0 is newest; frame_3 is oldest.  Disable on constrained systems.
    debug_enabled: true
    debug_topic_prefix: /temporal_lidar/debug
