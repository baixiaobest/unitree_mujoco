temporal_lidar:
  ros__parameters:
    # Two rolling raw clouds are deskewed using each point's ``time`` offset,
    # reduced to fixed front capture rays, then transformed to world history.
    input_topic: /utlidar/time_corrected/cloud
    output_topic: /temporal_lidar/observation
    map_frame: camera_init_correct
    base_frame: base_link
    raw_cloud_period_s: 0.065
    intercloud_tolerance_s: 0.025
    # A completed scan is emitted by every two consecutive raw clouds;
    # no fixed 130-ms scan timer is used.
    policy_hz: 12.5
    # Cloud callbacks only enqueue data. A short timer retries timestamped TF
    # lookups without blocking TF reception in the single-threaded executor.
    processing_hz: 100.0
    tf_wait_s: 0.25
    max_pending_clouds: 16
    min_z_m: -0.1
    max_z_m: 1.4
    max_range_m: 20.0
    # Raw cloud experiment measured float ``time`` offsets from 0 to ~0.063 s;
    # their zero is the message header/start time and their unit is seconds.
    point_time_field: time
    point_time_scale_s: 1.0
    # Match the training RayCaster: 256 fixed rays over the front 180 degrees.
    # A returned ray is a hit; an empty ray is observed free space at max range.
    # No direct rear rays are synthesized.
    capture_rays: 256
    capture_fov_deg: 180.0
    min_points_per_capture_ray: 1
    capture_return_percentile: 0.1
    # Form 128 physical bins over 360 degrees (64 across the front 180 degrees),
    # then repeat each coarse bin into the policy's unchanged 256-bin virtual grid.
    world_bins: 64
    # The 250-ms checkpoint normalizes held completed-scan age by one scan period.
    scan_age_max_s: 0.250
    # RViz-only clouds reconstructed from the exact polar bins sent to policy.
    # frame_0 is newest; frame_3 is oldest.  Disable on constrained systems.
    debug_enabled: true
    debug_topic_prefix: /temporal_lidar/debug
    # Lidar ablation experiment: after four completed scans have been collected,
    # keep injecting that exact (distance, validity, scan-age) policy observation.
    # The node republishes with a fresh scan timestamp so navigation does not fail
    # its lidar timeout. Leave false for all normal navigation runs.
    freeze_observation: false
